services:
  # PostgreSQL for UMKM Profiles & Core Relational Data
  db:
    image: postgres:16
    container_name: nusantaraexport_db
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: nusantaraexport
      POSTGRES_PASSWORD: Nusantar43xport!
      POSTGRES_DB: nusantaraexport_ai
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # Automated schema initialization
      - ../database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for RAG Caching & Session Management
  redis:
    image: redis:7-alpine
    container_name: nusantaraexport_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
